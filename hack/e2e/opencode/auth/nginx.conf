# Local-only authentication shim for the opencode browser E2E test.
#
# This file is mounted at /etc/nginx/conf.d/default.conf, so it must contain
# only a server block: the image's own nginx.conf already provides the
# events/http context. It is not a production authentication design: it
# injects a fixed user for the local kind cluster. See ../README.md.

server {
    listen 80;
    server_name _;

    # Readiness probe for the shim itself. Answering locally keeps the probe
    # independent of blipchat, which the proxy_pass below requires at startup.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        proxy_pass http://blipchat.blip-system.svc.cluster.local:80;

        proxy_http_version 1.1;
        # proxy_set_header replaces any inbound header of the same name, so a
        # client cannot choose the forwarded user.
        proxy_set_header X-Forwarded-User e2e;
        proxy_set_header Host $host;

        # Server-sent events: keep the upstream connection open and do not
        # buffer the agent's incremental output.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
