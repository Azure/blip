  const known = state.sessions.find((s) => s && s.name === name);
  const title = (known && known.title) || "New chat";
  const warning = "Delete \"" + title + "\"? This permanently deletes the chat's workspace and history, including any child chats.";
  if (!window.confirm(warning)) return;
  const button = $("delete");
  const hadFocus = document.activeElement === button;
  button.disabled = true;
  try {
    await api("/api/sessions/" + encodeURIComponent(name), { method: "DELETE" });
  } catch (err) {
    // A 404 means the chat is already gone, so finish the delete below.
    if (!err || err.status !== 404) {
      toast(err && err.message ? err.message : "Could not delete chat.");
      // The chat stays open. A 409 means the agent started running; the next
      // status update will hide Delete, but re-enable it now so this click is
      // not left stuck.
      if (state.current === name) {
        button.disabled = false;
        if (hadFocus) (button.hidden ? $("transcript") : button).focus();
      }
      return;
    }
  }
  if (state.current === name) {
    // Invalidate any in-flight open or resync so a late response cannot
    // restore the chat we just deleted.
    openSeq++;
    state.current = null;
    state.parent = "";
    state.sessionReady = false;
    state.pendingDeepLink = "";
    state.offset = 0;
    delete state.drafts[name];
    closeEvents();
    clearTranscript();
    showEmpty("No chat open", "Pick a chat from the list, or start a new one.");
    setOrigin("");
    setTitle("Blip Chat");
    $("text").value = "";
    updateLimit();
    $("text").disabled = true;
    $("send").disabled = true;
    $("profile").hidden = true;
    $("scope-badge").hidden = true;
    setQuestion(null);
    setStatus("no chat", false, "");
    markActive();
    setDeepLink("", true);
  }
  await loadSessions();
  if (hadFocus && !state.current) $("transcript").focus();
  toast("Chat deleted.");
};

const narrowViewport = window.matchMedia("(max-width: 820px)");
const drawerMode = window.matchMedia("(max-width: 820px), (pointer: coarse)");
narrowViewport.addEventListener("change", (e) => {
  if (!e.matches) {
    const wasOpen = document.body.classList.contains("sidebar-open");
    const hadFocus = $("sidebar").contains(document.activeElement);
    document.body.classList.remove("sidebar-open");
    document.querySelector("main").inert = false;
    document.querySelector(".skip-link").inert = false;
    $("sidebar-btn").setAttribute("aria-expanded", "false");
    if (wasOpen && hadFocus) {
      // On a coarse-pointer device the sidebar can still be an off-screen
      // drawer after rotating to a width above 820px. Keep focus on the
      // visible toggle rather than a hidden row.
      if (drawerMode.matches) {
        $("sidebar-btn").focus();
      } else {
        const target = $("sessions").querySelector(".session-open");
        (target || $("tab-team")).focus();
      }
    }
    return;
  }
  const menuHadFocus = $("new-menu").contains(document.activeElement);
  closeNewMenu();
  if (menuHadFocus || document.querySelector("aside").contains(document.activeElement)) {
    // When the drawer is open, main (including the Chats toggle) is inert, so
    // focus must go to a control inside the sidebar.
    const drawerOpen = document.body.classList.contains("sidebar-open");
    const target = drawerOpen ? ($("new-btn") || $("sessions").querySelector(".session-open")) : $("sidebar-btn");
    if (target) target.focus();
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearTimeout(sessionPollTimer);
    sessionPollTimer = 0;
    return;
  }
  loadSessions({ quiet: true });
  scheduleSessionPoll();
  refreshSessionTimes();
});
window.addEventListener("focus", () => {
  if (!document.hidden) loadSessions({ quiet: true });
});
setInterval(() => {
  if (!document.hidden) refreshSessionTimes();
}, 60000);

function hashName() {
  try {
    return decodeURIComponent((location.hash || "").replace(/^#/, ""));
  } catch (_) {
    return "";
  }
}

window.addEventListener("popstate", () => {
  const name = hashName();
  // "transcript" is the skip-link fragment, not a chat name. Returning to it
  // from a chat must also return the visible view to the no-chat state so the
  // URL and the rendered chat cannot disagree after a reload.
  if (name === "transcript") {
    if (state.current) resetChat();
    return;
  }
  if (name) openSession(name, true);
  else resetChat();
});

async function boot() {
  let saved = "";
  try { saved = localStorage.getItem("blip.scope") || ""; } catch (_) {}
  if (saved === "team" || saved === "user") state.scope = saved;
  syncTabs();
  await loadMe();
  await loadSessions();
  scheduleSessionPoll();
  const linked = hashName();
  if (linked && linked !== "transcript") await openSession(linked, true);
}

boot();
</script>
</body>
</html>
