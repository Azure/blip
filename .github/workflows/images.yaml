name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: make build

      - name: Build guest artifacts
        env:
          BLIP_GUEST_CACHE: ${{ runner.temp }}/guest-dl
        run: make guest

      - name: Image prefix
        id: prefix
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push images
        env:
          PREFIX: ${{ steps.prefix.outputs.name }}
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for img in blipd blip-slot blip-ubuntu blip-e2e; do
            docker buildx build --push --provenance=false \
              -f "images/$img/Dockerfile" \
              -t "$PREFIX/$img:$SHA" -t "$PREFIX/$img:main" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.revision=$SHA" \
              .
          done
