name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      resilience:
        description: Run the slow drain and restart scenarios
        type: boolean
        default: false
  schedule:
    # Nightly resilience pass. Pull requests run the fast Tier 1 suite.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUD_HYPERVISOR_VERSION: v54.1
  DEBIAN_SUITE: trixie

jobs:
  kind:
    name: kind e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio e2fsprogs kmod xz-utils zstd

      - name: Install Cloud Hypervisor
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloud-hypervisor \
            "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/${CLOUD_HYPERVISOR_VERSION}/cloud-hypervisor-static"
          sudo install -m 0755 /tmp/cloud-hypervisor /usr/local/bin/cloud-hypervisor
          cloud-hypervisor --version

      - name: Fetch guest kernel
        run: |
          set -euo pipefail
          eval "$(hack/guest/fetch-debian-kernel.sh amd64 build/guest/kernel)"
          {
            echo "KVER=$KVER"
            echo "KERNEL=$KERNEL"
            echo "MODDIR=$MODDIR"
          } >> "$GITHUB_ENV"

      - name: Start kind cluster
        run: ./hack/kind-up.sh

      - name: Run e2e tests
        env:
          BLIP_E2E_TIMEOUT: 300
          BLIP_E2E_FORK_MAX: 120
          BLIP_E2E_RESILIENCE: ${{ (github.event_name == 'schedule' || inputs.resilience) && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p e2e-logs
          ./hack/e2e.sh 2>&1 | tee e2e-logs/e2e.log

      - name: Collect diagnostics
        if: failure()
        timeout-minutes: 10
        run: |
          mkdir -p e2e-logs
          export KUBECONFIG="${HOME}/.kube/config"

          kubectl --context kind-blip-dev get nodes -o wide >e2e-logs/nodes.txt 2>&1 || true
          kubectl --context kind-blip-dev get all -A -o wide >e2e-logs/all.txt 2>&1 || true
          kubectl --context kind-blip-dev get blips,blipstates -A -o yaml >e2e-logs/blips.yaml 2>&1 || true
          kubectl --context kind-blip-dev get blipnodes,blippools -A -o yaml >e2e-logs/blip-api.yaml 2>&1 || true
          kubectl --context kind-blip-dev get events -A --sort-by=.lastTimestamp >e2e-logs/events.txt 2>&1 || true

          for ns in blip-system default; do
            kubectl --context kind-blip-dev -n "$ns" describe pods \
              >"e2e-logs/${ns}-pods.txt" 2>&1 || true
            kubectl --context kind-blip-dev -n "$ns" logs \
              --all-containers --prefix --tail=500 \
              >"e2e-logs/${ns}-logs.txt" 2>&1 || true
          done

          docker ps -a >e2e-logs/docker-ps.txt 2>&1 || true
          sudo dmesg >e2e-logs/dmesg.txt 2>&1 || true
          lsmod >e2e-logs/lsmod.txt 2>&1 || true
          df -h >e2e-logs/df.txt 2>&1 || true
          free -m >e2e-logs/free.txt 2>&1 || true
          cp build/kind/kustomization.yaml e2e-logs/ 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down kind cluster
        if: always()
        run: ./hack/kind-down.sh || true
