# Restricts what a VM's service account token can do. The controller keeps a
# ConfigMap blip-vm-owners in every namespace with a BlipPool:
#   sa.<service account>: <pools>  every VM service account, with the
#                                  space-separated pools that use it
#   <vm pod>: <owner>[ <uid>]      each claimed VM pod; "-" means unrestricted.
#                                  The optional UID is the thread incarnation
#                                  its Blip was created for.
#   thread.<thread>: <owner>       each thread's project owner hash, keyed by
#                                  the raw thread name used in spec.thread
#   thread-hash.<label>: <owner>   the same, keyed by the ThreadLabel a
#                                  blip.dev/thread label carries when the
#                                  thread name is too long for a label value
#   thread-inc.<owner>: <uid>      the current incarnation of that project's
#                                  thread, used to reject turns from a producer
#                                  created for a deleted thread
#   bases: <states>                space-separated shared, ownerless image states
# A caller authenticated with a pod-bound token of a VM service account may
# only connect to pods with `blip-runtime bridge 1025` in container vm (a blip
# session; no other exec, attach, proxy, or port-forward). A restricted owner may
# only do so into VM pods of the same owner, and may only create, change,
# and delete blips and states named "<owner>.<name>" and labelled
# blip.dev/owner=<owner> (before and after the change) that reference only
# such states (or copy/read-only mount shared bases), set no imagePullSecrets,
# and create blips only in pools of its own service account. Thread specs are
# administrator-owned: a restricted VM may read its own thread through the
# API proxy but may not create, change or delete threads. Every
# ownerReference it sets must name a Blip of the same owner: fork blips may
# only be owned by blips of the same owner, and states may only be owned by
# such blips. Every pod-bound token of the request namespace is treated as a
# VM and must have a claimed pod entry: a table that is non-empty but lacks the
# caller's sa.<sa> or pod key fails closed instead of skipping every check. A
# missing key is never treated as unrestricted for a claimed VM, because such a
# sync or cache gap would bypass every check. A VM pod without an entry
# (vacant, unknown, or absent from a partial table) is denied. Only a claimed
# pod recorded as "-" is unrestricted. Service account keys are pruned only
# once no pool or VM pod uses the account, and a missing table denies all blip
# and state changes made with pod-bound tokens. The namespace match condition
# keeps the controller and blipchat (which act from blip-system) and non-pod
# users out of this policy. Grant VM service accounts RBAC only in their own
# namespace: the table is per namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: blip-vm-owner
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blips, blips/status, blipstates, blipstates/status, blipthreads, blipthreads/status]
        operations: [CREATE, UPDATE, DELETE]
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy]
        operations: [CONNECT]
  matchConditions:
    - name: pod-bound-service-account-token
      expression: >-
        has(request.userInfo.extra) &&
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':')
  variables:
    - name: data
      expression: "has(params.data) ? params.data : {}"
    - name: callerSA
      expression: request.userInfo.username.split(':')[3]
    - name: callerPod
      expression: request.userInfo.extra['authentication.kubernetes.io/pod-name'][0]
    # matchConditions selected a pod-bound token in this namespace. Every such
    # caller is treated as a VM, even when the table is non-empty but lacks its
    # sa.<sa> and pod entry: an absent key is a sync or cache gap, not evidence
    # that the caller is unrestricted. Only a pod entry of "-" is
    # unrestricted. The namespace guard keeps the controller and blipchat
    # (which act from blip-system) and non-pod users out of this policy.
    - name: vm
      expression: "true"
    # A claimed pod's value is "<owner>" or "<owner> <thread UID>"; the
    # incarnation is used by blip-turn-owner, while this policy only needs the
    # owner field.
    - name: podEntry
      expression: >-
        variables.callerPod in variables.data ?
        string(variables.data[variables.callerPod]).split(' ') : []
    - name: owner
      expression: >-
        size(variables.podEntry) > 0 ?
        variables.podEntry[0] : ''
    - name: restricted
      expression: variables.vm && variables.owner != '-'
    - name: prefix
      expression: variables.owner + '.'
    - name: writes
      expression: request.operation == 'CREATE' || request.operation == 'UPDATE'
    - name: pools
      expression: >-
        ('sa.' + variables.callerSA) in variables.data ?
        string(variables.data['sa.' + variables.callerSA]).split(' ') : []
    - name: bases
      expression: "'bases' in variables.data ? string(variables.data['bases']).split(' ') : []"
    # A blip.dev/thread label decides which project's history a Blip's reports
    # are appended to. The label is self-asserted by the VM, so a restricted
    # owner may only set it to a thread it owns. Label values are
    # ThreadLabel(name): the raw name when it fits a label, otherwise a hash
    # recorded under "thread-hash.<label>". The hashed form has a reserved
    # prefix that is not a legal thread name, so a short thread can never carry
    # another thread's hash. Both encodings are still checked so objects from
    # before that split keep working.
    - name: thread
      expression: >-
        (request.operation == 'CREATE' || request.operation == 'UPDATE') &&
        has(object.metadata.labels) && 'blip.dev/thread' in object.metadata.labels ?
        string(object.metadata.labels['blip.dev/thread']) : ''
    - name: oldThread
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.labels) &&
        'blip.dev/thread' in oldObject.metadata.labels ?
        string(oldObject.metadata.labels['blip.dev/thread']) : ''
  validations:
    - expression: "!variables.vm || variables.owner != ''"
      messageExpression: >-
        'VM pod ' + variables.callerPod + ' is not claimed by a blip; its token cannot change blips or states or connect to pods'
      reason: Forbidden
    # status is controller-written. Letting a VM token write it would also
    # let it forge status.copiedFrom, which node export authorization uses to
    # decide whether copied state may be read.
    - expression: "!variables.restricted || !has(request.subResource) || request.subResource != 'status'"
      messageExpression: >-
        'owner ' + variables.owner + ' may not change status; only the controller writes it'
      reason: Forbidden
    # A thread's spec is administrator-owned and blipchat is the only writer
    # of its status. A restricted VM token may not create, relabel, rewrite or
    # delete a thread: its charter, system prompt, pool and base decide what
    # the project's coordinator runs next.
    - expression: "variables.owner == '-' || request.resource.resource != 'blipthreads'"
      messageExpression: >-
        'thread specs are administrator-owned; VM service account ' + variables.callerSA + ' may not change them'
      reason: Forbidden
    - expression: >-
        !variables.vm || request.operation != 'CONNECT' ||
        (request.subResource == 'exec' && has(object.container) && object.container == 'vm' &&
        object.command == ['blip-runtime', 'bridge', '1025'])
      messageExpression: >-
        'VM pods may only open blip sessions (exec blip-runtime bridge 1025 in container vm), not ' +
        request.subResource + ' into ' + request.name
      reason: Forbidden
    - expression: >-
        !variables.restricted || request.operation != 'CONNECT' ||
        (request.name in variables.data &&
        string(variables.data[request.name]).split(' ')[0] == variables.owner)
      messageExpression: >-
        'owner ' + variables.owner + ' may only connect to VM pods of its own blips, not ' + request.name
      reason: Forbidden
    - expression: >-
        !variables.restricted || request.operation != 'DELETE' ||
        oldObject.metadata.name.startsWith(variables.prefix)
      messageExpression: >-
        'owner ' + variables.owner + ' may only delete objects named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || (request.operation != 'UPDATE' && request.operation != 'DELETE') ||
        (has(oldObject.metadata.labels) && 'blip.dev/owner' in oldObject.metadata.labels &&
        oldObject.metadata.labels['blip.dev/owner'] == variables.owner)
      messageExpression: >-
        'owner ' + variables.owner + ' may only change objects labelled blip.dev/owner=' + variables.owner
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes ||
        object.metadata.name.startsWith(variables.prefix)
      messageExpression: >-
        'owner ' + variables.owner + ' may only write objects named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes ||
        (has(object.metadata.labels) && 'blip.dev/owner' in object.metadata.labels &&
        object.metadata.labels['blip.dev/owner'] == variables.owner)
      messageExpression: >-
        'owner ' + variables.owner + ' must label its objects blip.dev/owner=' + variables.owner
      reason: Forbidden
    # An attacker must not steer its reports into another project's thread by
    # relabelling its own Blip. The label may only name a thread of the same
    # owner, and an unchanged label stays valid when the thread is gone.
    - expression: >-
        !variables.restricted || !variables.writes || request.resource.resource != 'blips' ||
        variables.thread == variables.oldThread ||
        (variables.thread != '' &&
        ((('thread.' + variables.thread) in variables.data &&
        string(variables.data['thread.' + variables.thread]) == variables.owner) ||
        (('thread-hash.' + variables.thread) in variables.data &&
        string(variables.data['thread-hash.' + variables.thread]) == variables.owner)))
      messageExpression: >-
        'owner ' + variables.owner + ' may only attach blip.dev/thread labels of its own threads'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes ||
        !has(object.metadata.ownerReferences) ||
        object.metadata.ownerReferences.all(o,
          o.apiVersion == 'blip.dev/v1alpha1' && o.kind == 'Blip' &&
          (!has(o.controller) || o.controller != true) &&
          (!has(o.blockOwnerDeletion) || o.blockOwnerDeletion != true) &&
          o.name.startsWith(variables.prefix))
      messageExpression: >-
        'owner ' + variables.owner + ' may only set ownerReferences to blips named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes || request.resource.resource != 'blips' || !has(object.spec) ||
        has(object.spec.state) && object.spec.state.startsWith(variables.prefix)
      messageExpression: >-
        'owner ' + variables.owner + ' may only use states named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || request.operation != 'CREATE' || request.resource.resource != 'blipstates' || !has(object.spec) ||
        !has(object.spec.copyFrom) || object.spec.copyFrom.startsWith(variables.prefix) ||
        object.spec.copyFrom in variables.bases
      messageExpression: >-
        'owner ' + variables.owner + ' may only copy states named ' + variables.prefix + '* or shared bases'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes || request.resource.resource != 'blipstates' || !has(object.spec) ||
        !has(object.spec.mounts) || object.spec.mounts.all(m,
          m.state.startsWith(variables.prefix) ||
          ((!has(m.writable) || !m.writable) && m.state in variables.bases))
      messageExpression: >-
        'owner ' + variables.owner + ' may only mount its own states or read-only shared bases'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes || !has(object.spec) ||
        !has(object.spec.imagePullSecrets) || size(object.spec.imagePullSecrets) == 0
      messageExpression: >-
        'owner ' + variables.owner + ' may not set imagePullSecrets'
      reason: Forbidden
    - expression: >-
        !variables.restricted || request.operation != 'CREATE' || request.resource.resource != 'blips' ||
        (has(object.spec) && has(object.spec.pool) && object.spec.pool != '' ? object.spec.pool : 'default') in variables.pools
      messageExpression: >-
        'owner ' + variables.owner + ' may only use pools of service account ' + variables.callerSA +
        ' (' + variables.pools.join(', ') + ')'
      reason: Forbidden
---
# Without the table, pod-bound tokens may not create blips or states. Updates
# and deletes must still be allowed: a terminating namespace drops the table
# before the controller removes its finalizers, and a Deny there would leave
# the namespace stuck in Terminating forever.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-vm-owner
spec:
  policyName: blip-vm-owner
  validationActions: [Deny]
  paramRef:
    name: blip-vm-owners
    parameterNotFoundAction: Allow
  matchResources:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blips, blips/status, blipstates, blipstates/status, blipthreads, blipthreads/status]
        operations: [UPDATE, DELETE]
---
# New objects stay fail-secure: no table means no creation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-vm-owner-create
spec:
  policyName: blip-vm-owner
  validationActions: [Deny]
  paramRef:
    name: blip-vm-owners
    parameterNotFoundAction: Deny
  matchResources:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blips, blips/status, blipstates, blipstates/status, blipthreads, blipthreads/status]
        operations: [CREATE]
---
# Namespaces without blips keep pod exec working for their own workloads.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-vm-owner-connect
spec:
  policyName: blip-vm-owner
  validationActions: [Deny]
  paramRef:
    name: blip-vm-owners
    parameterNotFoundAction: Allow
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy]
        operations: [CONNECT]
