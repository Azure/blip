# Restricts what a VM's service account token can do. The controller keeps a
# ConfigMap blip-vm-owners in every namespace with a BlipPool:
#   sa.<service account>: <pools>  every VM service account, with the
#                                  space-separated pools that use it
#   <vm pod>: <owner>              each claimed VM pod; "-" means unrestricted,
#                                  "chat:<owner>" a chat VM (write-blocked)
#   bases: <states>                space-separated shared, ownerless image states
# A caller authenticated with a pod-bound token of a VM service account may not
# exec, attach, proxy, or port-forward to any pod. A restricted owner may only
# create, change, and delete blips and states named "<owner>.<name>" and
# labelled blip.dev/owner=<owner> (before and after the change) that reference
# only such states (or copy/read-only mount shared bases), set no
# imagePullSecrets, and create blips only in pools of its own service account.
# Every new or changed ownerReference it sets must name an object of the same
# owner: fork blips may only be owned by blips, and states may be owned by such
# blips or by another state (a durable fork's hidden children are owned by
# their root state). An ownerReference inherited unchanged from the privileged
# creator (for example the parent of a fork) is exempt, so a restricted child
# can still update itself. Finalizers are likewise write-once for a restricted
# owner: it may keep finalizers already on the stored object and remove them,
# but may not add any, so an attacker cannot leave its Blip or state
# Terminating after the controller removes blip.dev/finalizer. Every pod-bound
# token of the request namespace is treated as a VM and must have a claimed pod
# entry: a table that is non-empty but lacks the caller's sa.<sa> or pod key
# fails closed instead of skipping every check. A missing key is never treated
# as unrestricted for a claimed VM, because such a sync or cache gap would
# bypass every check. A VM pod without an entry (vacant, unknown, or absent
# from a partial table) is denied. Only a claimed pod recorded as "-" is
# unrestricted. A pod entry starting with "chat:" marks a blipchat chat VM:
# blipchat creates and writes those blips and states with its blip-system
# service account, so the chat VM's own token may never modify either. Service
# account keys are pruned only once no pool or VM pod
# uses the account, and a missing table denies all blip and state changes made
# with pod-bound tokens. The namespace match condition keeps the controller and
# blipchat (which act from blip-system) and non-pod users out of this policy.
# Grant VM service accounts RBAC only in their own namespace: the table is per
# namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: blip-vm-owner
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blips, blips/status, blipstates, blipstates/status]
        operations: [CREATE, UPDATE, DELETE]
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy]
        operations: [CONNECT]
  matchConditions:
    - name: pod-bound-service-account-token
      expression: >-
        has(request.userInfo.extra) &&
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':')
  variables:
    - name: data
      expression: "has(params.data) ? params.data : {}"
    - name: callerSA
      expression: request.userInfo.username.split(':')[3]
    - name: callerPod
      expression: request.userInfo.extra['authentication.kubernetes.io/pod-name'][0]
    # matchConditions selected a pod-bound token in this namespace. Every such
    # caller is treated as a VM, even when the table is non-empty but lacks its
    # sa.<sa> and pod entry: an absent key is a sync or cache gap, not evidence
    # that the caller is unrestricted. Only a pod entry of "-" is
    # unrestricted. The namespace guard keeps the controller and blipchat
    # (which act from blip-system) and non-pod users out of this policy.
    - name: vm
      expression: "true"
    # A claimed pod's entry starts with its owner; legacy entries may carry a
    # trailing field, which is ignored.
    - name: podEntry
      expression: >-
        variables.callerPod in variables.data ?
        string(variables.data[variables.callerPod]).split(' ') : []
    - name: owner
      expression: >-
        size(variables.podEntry) > 0 ?
        variables.podEntry[0] : ''
    # Chat VMs are created by blipchat and act for its blip-system service
    # account; their table entry marks them with a chat: prefix.
    - name: chat
      expression: >-
        size(variables.podEntry) > 0 && variables.podEntry[0].startsWith('chat:')
    - name: restricted
      expression: variables.vm && variables.owner != '-'
    - name: prefix
      expression: variables.owner + '.'
    - name: writes
      expression: request.operation == 'CREATE' || request.operation == 'UPDATE'
    - name: pools
      expression: >-
        ('sa.' + variables.callerSA) in variables.data ?
        string(variables.data['sa.' + variables.callerSA]).split(' ') : []
    - name: bases
      expression: "'bases' in variables.data ? string(variables.data['bases']).split(' ') : []"
    # A child forked from a different-owner or unrestricted Blip inherits the
    # ownerReference its privileged creator set. An UPDATE by the child's own
    # VM leaves that reference untouched, so the prefix rule must exempt
    # references already present in oldObject; otherwise no self-patch can
    # succeed. New or changed references are still checked in full.
    - name: oldOwnerReferences
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.ownerReferences) ?
        oldObject.metadata.ownerReferences : []
    # Finalizers make an object undeletable. A foreign finalizer left on a Blip
    # or state keeps it Terminating forever after the controller removes its
    # own blip.dev/finalizer. A restricted VM may therefore only carry
    # finalizers that were already on the stored object: additions on CREATE
    # (no oldObject) and UPDATE are denied, while unchanged inherited
    # finalizers and removals stay allowed for normal patches and cleanup.
    - name: finalizers
      expression: >-
        variables.writes && has(object.metadata.finalizers) ?
        object.metadata.finalizers : []
    - name: oldFinalizers
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.finalizers) ?
        oldObject.metadata.finalizers : []
  validations:
    # Chat VMs are pod-bound, but blipchat writes their blips and states on
    # their behalf; direct API writes would bypass the chat agent tools.
    - expression: "!variables.chat"
      message: chat agents may not modify blips or blipstates; use the agent tools
      reason: Forbidden
    - expression: "!variables.vm || variables.owner != ''"
      messageExpression: >-
        'VM pod ' + variables.callerPod + ' is not claimed by a blip; its token cannot change blips or states or connect to pods'
      reason: Forbidden
    # status is controller-written. Letting a VM token write it would also
    # let it forge status.copiedFrom, which node export authorization uses to
    # decide whether copied state may be read.
    - expression: "!variables.restricted || !has(request.subResource) || request.subResource != 'status'"
      messageExpression: >-
        'owner ' + variables.owner + ' may not change status; only the controller writes it'
      reason: Forbidden
    # VM tokens may not exec, attach, proxy, or port-forward to pods. The
    # in-guest API talks to the Kubernetes API directly; there is no pod exec
    # path.
    - expression: "!variables.vm || request.operation != 'CONNECT'"
      messageExpression: >-
        'VM pod ' + variables.callerPod + ' may not connect to pods (' +
        request.subResource + ' into ' + request.name + ')'
      reason: Forbidden
    - expression: >-
        !variables.restricted || request.operation != 'DELETE' ||
        oldObject.metadata.name.startsWith(variables.prefix)
      messageExpression: >-
        'owner ' + variables.owner + ' may only delete objects named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || (request.operation != 'UPDATE' && request.operation != 'DELETE') ||
        (has(oldObject.metadata.labels) && 'blip.dev/owner' in oldObject.metadata.labels &&
        oldObject.metadata.labels['blip.dev/owner'] == variables.owner)
      messageExpression: >-
        'owner ' + variables.owner + ' may only change objects labelled blip.dev/owner=' + variables.owner
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes ||
        object.metadata.name.startsWith(variables.prefix)
      messageExpression: >-
        'owner ' + variables.owner + ' may only write objects named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes ||
        (has(object.metadata.labels) && 'blip.dev/owner' in object.metadata.labels &&
        object.metadata.labels['blip.dev/owner'] == variables.owner)
      messageExpression: >-
        'owner ' + variables.owner + ' must label its objects blip.dev/owner=' + variables.owner
      reason: Forbidden
    # Restricted VMs may only write blips and states, so this covers every
    # object they can make undeletable. Controller, blipchat, and
    # administrator-owned VMs are not restricted and remain unaffected,
    # including the controller's own finalizer removal.
    - expression: >-
        !variables.restricted || !variables.writes ||
        variables.finalizers.all(f, f in variables.oldFinalizers)
      messageExpression: >-
        'owner ' + variables.owner + ' may not add finalizers to its objects'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes ||
        !has(object.metadata.ownerReferences) ||
        object.metadata.ownerReferences.all(o,
          o.apiVersion == 'blip.dev/v1alpha1' &&
          (o.kind == 'Blip' || (o.kind == 'BlipState' && request.resource.resource == 'blipstates')) &&
          (!has(o.controller) || o.controller != true) &&
          (!has(o.blockOwnerDeletion) || o.blockOwnerDeletion != true) &&
          (o.name.startsWith(variables.prefix) || o in variables.oldOwnerReferences))
      messageExpression: >-
        'owner ' + variables.owner + ' may only set ownerReferences to blips or states named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes || request.resource.resource != 'blips' || !has(object.spec) ||
        has(object.spec.state) && object.spec.state.startsWith(variables.prefix)
      messageExpression: >-
        'owner ' + variables.owner + ' may only use states named ' + variables.prefix + '*'
      reason: Forbidden
    - expression: >-
        !variables.restricted || request.operation != 'CREATE' || request.resource.resource != 'blipstates' || !has(object.spec) ||
        !has(object.spec.copyFrom) || object.spec.copyFrom.startsWith(variables.prefix) ||
        object.spec.copyFrom in variables.bases
      messageExpression: >-
        'owner ' + variables.owner + ' may only copy states named ' + variables.prefix + '* or shared bases'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes || request.resource.resource != 'blipstates' || !has(object.spec) ||
        !has(object.spec.mounts) || object.spec.mounts.all(m,
          m.state.startsWith(variables.prefix) ||
          ((!has(m.writable) || !m.writable) && m.state in variables.bases))
      messageExpression: >-
        'owner ' + variables.owner + ' may only mount its own states or read-only shared bases'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes || !has(object.spec) ||
        !has(object.spec.imagePullSecrets) || size(object.spec.imagePullSecrets) == 0
      messageExpression: >-
        'owner ' + variables.owner + ' may not set imagePullSecrets'
      reason: Forbidden
    - expression: >-
        !variables.restricted || !variables.writes || !has(object.spec) ||
        !has(object.spec.build)
      messageExpression: >-
        'owner ' + variables.owner + ' may not set spec.build'
      reason: Forbidden
    - expression: >-
        !variables.restricted || request.operation != 'CREATE' || request.resource.resource != 'blips' ||
        (has(object.spec) && has(object.spec.pool) && object.spec.pool != '' ? object.spec.pool : 'default') in variables.pools
      messageExpression: >-
        'owner ' + variables.owner + ' may only use pools of service account ' + variables.callerSA +
        ' (' + variables.pools.join(', ') + ')'
      reason: Forbidden
---
# Without the table, pod-bound tokens may not create blips or states. Updates
# and deletes must still be allowed: a terminating namespace drops the table
# before the controller removes its finalizers, and a Deny there would leave
# the namespace stuck in Terminating forever.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-vm-owner
spec:
  policyName: blip-vm-owner
  validationActions: [Deny]
  paramRef:
    name: blip-vm-owners
    parameterNotFoundAction: Allow
  matchResources:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blips, blips/status, blipstates, blipstates/status]
        operations: [UPDATE, DELETE]
---
# New objects stay fail-secure: no table means no creation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-vm-owner-create
spec:
  policyName: blip-vm-owner
  validationActions: [Deny]
  paramRef:
    name: blip-vm-owners
    parameterNotFoundAction: Deny
  matchResources:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blips, blips/status, blipstates, blipstates/status]
        operations: [CREATE]
---
# Namespaces without a blip-vm-owners table keep pod exec working for their
# own workloads; claimed VM pods are denied by the policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-vm-owner-connect
spec:
  policyName: blip-vm-owner
  validationActions: [Deny]
  paramRef:
    name: blip-vm-owners
    parameterNotFoundAction: Allow
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        resources: [pods/exec, pods/attach, pods/portforward, pods/proxy]
        operations: [CONNECT]
