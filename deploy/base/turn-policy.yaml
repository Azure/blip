# BlipTurns are the only way to talk to a project's coordinator. They are
# written by in-cluster producers only: blipchat itself, and service accounts
# acting for an external front end. A producer that is not blipchat must name
# its own identity, so a turn can never claim to be a user without going
# through the authenticated front end.
#
# Only a pod-bound token whose service account belongs to the request
# namespace is matched: pod names are namespace-local, so another namespace's
# token must never resolve an owner entry in this namespace's table.
#
# A pod-bound VM token is additionally bound to its own project: the
# controller records each thread's owner hash in blip-vm-owners, and the
# caller's claimed pod maps to the same hash. The blip.dev/thread and
# blip.dev/owner labels are self-asserted, so they must agree with that hash
# too; otherwise a VM could send a turn to its own thread while labelling it
# into another project's in-guest turn list. The table also records the
# current thread incarnation under thread-inc.<owner>, and the claimed pod's
# entry carries the incarnation its Blip was created for. A producer left over
# from a deleted thread therefore cannot write turns into the recreated one.
#
# Turns are immutable history. Pod-bound producers may not update or delete
# them, and the deterministic names blipchat uses for watcher and coordinator
# turns are reserved.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: blip-turn-author
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blipturns]
        operations: [CREATE, UPDATE, DELETE]
  variables:
    # Compare the whole username, not just the service account name: any
    # namespace may contain a ServiceAccount called blipchat. Only the
    # blipchat deployed in blip-system may author a turn as someone else.
    - name: blipchat
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:blip-system:blipchat'
    # A pod-bound token is a VM token, or another workload's. Neither may
    # rewrite or delete turns, and neither may squat the deterministic names
    # blipchat uses for watcher and coordinator turns.
    - name: podBound
      expression: >-
        has(request.userInfo.extra) &&
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra
  validations:
    - expression: >-
        variables.blipchat || request.operation != 'CREATE' ||
        (object.spec.author.kind == 'ServiceAccount' &&
        object.spec.author.name == request.userInfo.username)
      messageExpression: >-
        'turns must be created by blipchat or by a service account that names
        itself; ' + request.userInfo.username + ' must set
        author.kind=ServiceAccount and author.name to its own username'
      reason: Forbidden
    # The watcher names report and finish turns deterministically and
    # createTurnIn treats an existing turn as a retry, so a producer that can
    # pre-create blip-<uid>-r<seq> or blip-<uid>-fin can suppress history.
    # Coordinator turns have their own reserved prefix.
    - expression: >-
        variables.blipchat || request.operation != 'CREATE' ||
        (!object.metadata.name.startsWith('blip-') &&
        !object.metadata.name.startsWith('coord-'))
      messageExpression: >-
        'the blip- and coord- turn names are reserved for blipchat'
      reason: Forbidden
    - expression: >-
        variables.blipchat || !variables.podBound ||
        (request.operation != 'UPDATE' && request.operation != 'DELETE')
      messageExpression: >-
        'turns are immutable history; pod-bound service account ' +
        request.userInfo.username + ' may not change or delete them'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-turn-author
spec:
  policyName: blip-turn-author
  validationActions: [Deny]
---
# A turn's status.seq is its position in the thread's single global order.
# Only the sequencer in blipchat assigns it; allowing any other holder of
# blipturns/status to write it could hide or reorder turns. This is defense in
# depth behind RBAC, and it also stops an administrator with a broad token
# from accidentally forging a sequence jump.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: blip-turn-status
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blipturns/status]
        operations: [UPDATE]
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:blip-system:blipchat'
      message: only blipchat may write turn status
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-turn-status
spec:
  policyName: blip-turn-status
  validationActions: [Deny]
---
# A thread's status is the coordinator's summary of its work and orders turns
# (lastSeq). Only the coordinator in blipchat writes it; allowing any other
# holder of blipthreads/status to write could hide tasks, reset paused state,
# or reorder the thread. This mirrors blip-turn-status as defense in depth
# behind RBAC, and also stops an administrator with a broad token from
# accidentally forging thread status.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: blip-thread-status
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blipthreads/status]
        operations: [UPDATE]
  validations:
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:blip-system:blipchat'
      message: only blipchat may write thread status
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-thread-status
spec:
  policyName: blip-thread-status
  validationActions: [Deny]
---
# Pod-bound producers may only author turns for their own project. The
# controller maintains thread.<name>: <owner> in blip-vm-owners; the caller's
# pod entry must carry the same owner. blipchat and unrestricted VMs are not
# bound. A missing table denies turn creation, like blip-vm-owner-create:
# skipping the policy would leave a pod-bound producer free to write any
# thread, so the table must be present before turns can be produced.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: blip-turn-owner
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [blip.dev]
        apiVersions: ["*"]
        resources: [blipturns]
        operations: [CREATE]
  matchConditions:
    - name: pod-bound-service-account-token
      expression: >-
        has(request.userInfo.extra) &&
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':')
  variables:
    - name: blipchat
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:blip-system:blipchat'
    - name: data
      expression: "has(params.data) ? params.data : {}"
    - name: callerPod
      expression: request.userInfo.extra['authentication.kubernetes.io/pod-name'][0]
    # A claimed pod's value is "<owner>" or "<owner> <thread UID>". Split it
    # so the owner checks stay backward compatible with entries written before
    # incarnation tracking.
    - name: podEntry
      expression: >-
        variables.callerPod in variables.data ?
        string(variables.data[variables.callerPod]).split(' ') : []
    - name: owner
      expression: >-
        size(variables.podEntry) > 0 ?
        variables.podEntry[0] : ''
    - name: podThreadUID
      expression: >-
        size(variables.podEntry) > 1 ?
        variables.podEntry[1] : ''
    - name: threadKey
      expression: "'thread.' + object.spec.thread"
    - name: threadOwner
      expression: >-
        variables.threadKey in variables.data ?
        string(variables.data[variables.threadKey]) : ''
    # The controller publishes the current incarnation of each thread owner
    # under "thread-inc.<owner>". A pod created for the previous incarnation of
    # a recreated thread carries its old UID in its pod entry and is rejected.
    - name: threadIncKey
      expression: "'thread-inc.' + variables.threadOwner"
    - name: threadUID
      expression: >-
        variables.threadOwner != '' && variables.threadIncKey in variables.data ?
        string(variables.data[variables.threadIncKey]) : ''
    # The turn's labels are written by its producer. A turn that names the
    # producer's own thread in spec.thread must not carry another project's
    # label, because the in-guest API proxy selects turns by blip.dev/thread
    # and prefixes owner-labelled objects with blip.dev/owner.
    - name: threadLabel
      expression: >-
        has(object.metadata.labels) && 'blip.dev/thread' in object.metadata.labels ?
        string(object.metadata.labels['blip.dev/thread']) : ''
    - name: ownerLabel
      expression: >-
        has(object.metadata.labels) && 'blip.dev/owner' in object.metadata.labels ?
        string(object.metadata.labels['blip.dev/owner']) : ''
  validations:
    - expression: >-
        variables.blipchat || variables.owner == '-' ||
        (variables.owner != '' && variables.threadOwner == variables.owner &&
        variables.threadUID != '' && variables.podThreadUID == variables.threadUID)
      messageExpression: >-
        'pod-bound producer ' + request.userInfo.username +
        ' may only author turns for a thread of its own project; ' +
        (variables.threadOwner == '' ?
        'thread ' + object.spec.thread + ' has no recorded owner' :
        variables.threadOwner != variables.owner ?
        'owner ' + variables.owner + ' does not own thread ' + object.spec.thread :
        variables.threadUID == '' ?
        'thread ' + object.spec.thread + ' has no recorded incarnation' :
        'the producer was not created for the current incarnation of thread ' +
        object.spec.thread)
      reason: Forbidden
    # Either encoding of the label is accepted, but it must resolve to the
    # owner of spec.thread. A raw short name lives under "thread.<label>";
    # a long name's hashed label lives under "thread-hash.<label>" and uses a
    # reserved prefix that no thread name can contain.
    - expression: >-
        variables.blipchat || request.operation != 'CREATE' ||
        variables.threadLabel == '' ||
        (('thread.' + variables.threadLabel) in variables.data &&
        string(variables.data['thread.' + variables.threadLabel]) == variables.threadOwner) ||
        (('thread-hash.' + variables.threadLabel) in variables.data &&
        string(variables.data['thread-hash.' + variables.threadLabel]) == variables.threadOwner)
      messageExpression: >-
        'blip.dev/thread on a turn must name the thread in spec.thread; ' +
        variables.threadLabel + ' does not belong to ' + object.spec.thread
      reason: Forbidden
    - expression: >-
        variables.blipchat || request.operation != 'CREATE' ||
        variables.ownerLabel == '' ||
        variables.ownerLabel == variables.threadOwner
      messageExpression: >-
        'blip.dev/owner on a turn must be the owner of spec.thread ' +
        object.spec.thread + ', not ' + variables.ownerLabel
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: blip-turn-owner
spec:
  policyName: blip-turn-owner
  validationActions: [Deny]
  paramRef:
    name: blip-vm-owners
    parameterNotFoundAction: Deny
