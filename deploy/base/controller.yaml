apiVersion: v1
kind: ServiceAccount
metadata:
  name: blip-controller
  namespace: blip-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blip-controller
rules:
  # Includes delete on blips for the terminated-blip garbage collector.
  - apiGroups: [blip.dev]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  # The stream API's serving certificate Secret and APIService.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch, create, update]
  # The blip-vm-owners table of the blip-vm-owner admission policy.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, patch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blip-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blip-controller
subjects:
  - kind: ServiceAccount
    name: blip-controller
    namespace: blip-system
---
# The controller creates the cluster disk key Secret (blip-disk-key) on first
# start.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blip-controller-disk-key
  namespace: blip-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blip-controller-disk-key
  namespace: blip-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blip-controller-disk-key
subjects:
  - kind: ServiceAccount
    name: blip-controller
    namespace: blip-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blip-controller-leader-election
  namespace: blip-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blip-controller-leader-election
  namespace: blip-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blip-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: blip-controller
    namespace: blip-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blip-controller
  namespace: blip-system
  labels:
    app.kubernetes.io/name: blip-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blip-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blip-controller
    spec:
      serviceAccountName: blip-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: ghcr.io/azure/blip-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --runtime-image=$(RUNTIME_IMAGE)
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The image of every VM pod's vm container.
            - name: RUNTIME_IMAGE
              value: ghcr.io/azure/blip-runtime:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
