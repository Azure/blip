apiVersion: v1
kind: ServiceAccount
metadata:
  name: blipchat
  namespace: blip-system
---
# blipchat creates one BlipState per chat and one Blip per generation. It
# writes the stdin/stdout of a chat through the aggregated stream API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blipchat
rules:
  - apiGroups: [blip.dev]
    resources: [blipstates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blip.dev]
    resources: [blips]
    verbs: [get, list, watch, create, update, patch, delete]
  # The stream API authorizes resource requests (blipstreams/log and
  # blipstreams/stdin) through SubjectAccessReview; the non-resource rule
  # covers discovery and any handler that authorizes the raw path.
  - apiGroups: [stream.blip.dev]
    resources: [blipstreams, blipstreams/log]
    verbs: [get]
  - apiGroups: [stream.blip.dev]
    resources: [blipstreams, blipstreams/stdin]
    verbs: [create]
  - nonResourceURLs: ["/apis/stream.blip.dev/*"]
    verbs: [get, post]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blipchat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blipchat
subjects:
  - kind: ServiceAccount
    name: blipchat
    namespace: blip-system
---
# Profiles live next to the deployment. A missing ConfigMap is allowed: the
# built-in default profile remains available.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blipchat-profiles
  namespace: blip-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blipchat-profiles
  namespace: blip-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blipchat-profiles
subjects:
  - kind: ServiceAccount
    name: blipchat
    namespace: blip-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blipchat
  namespace: blip-system
  labels:
    app.kubernetes.io/name: blipchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blipchat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blipchat
    spec:
      serviceAccountName: blipchat
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: blipchat
          image: ghcr.io/azure/blip-blipchat:latest
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8080
            - --namespace=default
            - --profiles-configmap=blip-system/blip-chat-profiles
            - --auto-approve=always
            - --default-pool=default
            - --log-level=info
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: blipchat
  namespace: blip-system
  labels:
    app.kubernetes.io/name: blipchat
spec:
  selector:
    app.kubernetes.io/name: blipchat
  ports:
    - name: http
      port: 80
      targetPort: 8080
