apiVersion: v1
kind: ServiceAccount
metadata:
  name: blipchat
  namespace: blip-system
---
# blipchat is a stateless coordinator: it serves the chat API and mutates
# turns, threads and blips on behalf of users, so it needs write access to
# those resources but never owns storage.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blipchat
rules:
  - apiGroups: [blip.dev]
    resources: [blipturns]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blip.dev]
    resources: [blipturns/status]
    verbs: [get, update, patch]
  - apiGroups: [blip.dev]
    resources: [blipthreads]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [blip.dev]
    resources: [blipthreads/status]
    verbs: [get, update, patch]
  - apiGroups: [blip.dev]
    resources: [blips]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blip.dev]
    resources: [blipstates]
    verbs: [get, list, watch, create]
  - apiGroups: [blip.dev]
    resources: [blippools]
    verbs: [get, list, watch]
  # Inspects pods to report sandbox health for a turn; exec is used to probe a
  # guest when the pod API cannot answer.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  # Leader election lease for the active coordinator replica.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blipchat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blipchat
subjects:
  - kind: ServiceAccount
    name: blipchat
    namespace: blip-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blipchat
  namespace: blip-system
  labels:
    app.kubernetes.io/name: blipchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blipchat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blipchat
    spec:
      serviceAccountName: blipchat
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: blipchat
          image: ghcr.io/azure/blipchat:latest
          imagePullPolicy: IfNotPresent
          # blipchat talks to the guest LLM through an OpenAI-compatible proxy.
          # The default points at an intentionally unresolvable host: an
          # operator must replace --llm-base-url with their own proxy endpoint
          # in an overlay before chat turns can complete.
          args:
            - --leader-elect
            - --listen=:8080
            - --llm-base-url=http://llm.invalid/v1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: blipchat
  namespace: blip-system
  labels:
    app.kubernetes.io/name: blipchat
spec:
  selector:
    app.kubernetes.io/name: blipchat
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
