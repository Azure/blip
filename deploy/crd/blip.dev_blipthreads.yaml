---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: blipthreads.blip.dev
spec:
  group: blip.dev
  names:
    kind: BlipThread
    listKind: BlipThreadList
    plural: blipthreads
    singular: blipthread
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pool
      name: Pool
      type: string
    - jsonPath: .status.lastSeq
      name: Seq
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BlipThread is one project's long-running coordinator. Its spec is owned by
              administrators; blipchat is the only writer of its status. The thread does
              not itself run anything: blipchat turns its turns, timers, and the blips it
              starts into coordinator steps.
            properties:
              base:
                description: |-
                  Base is the BlipState new task blips fork from, when the coordinator
                  does not choose another one.
                type: string
              charter:
                description: |-
                  Charter is the project's standing instructions for the coordinator:
                  what the project is, how work is reviewed, and which task attribute
                  conventions (state, after, pr, ...) the project uses. The engine never
                  interprets attributes, so conventions live here.
                maxLength: 16384
                type: string
              dailyTokens:
                description: |-
                  DailyTokens caps the tokens one day of coordinator steps may spend.
                  0 means no cap.
                format: int64
                minimum: 0
                type: integer
              heartbeat:
                description: |-
                  Heartbeat wakes the coordinator while it has open tasks. The default
                  is 30 minutes.
                type: string
                x-kubernetes-validations:
                - message: heartbeat must be a non-negative duration
                  rule: duration(self) >= duration('0s')
              maxRunning:
                default: 1
                description: MaxRunning caps concurrently running blips labelled with
                  this thread.
                format: int32
                minimum: 1
                type: integer
              model:
                description: Model is the model name passed to the OpenAI-compatible
                  endpoint.
                type: string
              pool:
                description: Pool is the BlipPool tasks run in.
                minLength: 1
                type: string
              retention:
                description: Retention bounds the history blipchat keeps for this
                  thread.
                properties:
                  closedTasks:
                    description: ClosedTasks is how long closed tasks are kept after
                      their last update.
                    type: string
                    x-kubernetes-validations:
                    - message: retention.closedTasks must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                  keepTurns:
                    description: KeepTurns is the minimum number of turns kept per
                      thread.
                    format: int32
                    minimum: 0
                    type: integer
                  maxTasks:
                    description: MaxTasks caps the task board. The oldest closed tasks
                      are pruned first.
                    format: int32
                    minimum: 0
                    type: integer
                  turns:
                    description: Turns is how long processed turns are kept.
                    type: string
                    x-kubernetes-validations:
                    - message: retention.turns must be a non-negative duration
                      rule: duration(self) >= duration('0s')
                type: object
              systemPrompt:
                description: |-
                  SystemPrompt is the full system prompt for coordinator steps. When
                  empty, blipchat uses its built-in coordinator prompt. The charter is
                  appended after this text.
                maxLength: 16384
                type: string
            required:
            - pool
            type: object
          status:
            description: BlipThreadStatus is written only by blipchat.
            properties:
              consumedSeq:
                description: |-
                  ConsumedSeq is the highest turn sequence included in a coordinator
                  step. Turns at or below it are history.
                format: int64
                type: integer
              lastSeq:
                description: LastSeq is the highest turn sequence reserved for this
                  thread.
                format: int64
                type: integer
              nextWake:
                description: NextWake is when blipchat next runs a step, if any.
                format: date-time
                type: string
              paused:
                description: Paused stops coordinator steps. Turns still accumulate.
                properties:
                  reason:
                    type: string
                type: object
              summary:
                description: Summary is the coordinator's rolling summary of consumed
                  history.
                maxLength: 16384
                type: string
              tasks:
                description: Tasks is the coordinator's task board.
                items:
                  description: |-
                    ThreadTask is one unit of project work. Ids and titles are chosen by the
                    coordinator; attributes are free-form conventions declared in the charter.
                  properties:
                    attributes:
                      additionalProperties:
                        type: string
                      description: |-
                        Attributes are coordinator-owned conventions such as state, after, or
                        pr. The engine never interprets them.
                      maxProperties: 16
                      type: object
                      x-kubernetes-validations:
                      - message: attribute keys are at most 63 and values at most
                          256 characters
                        rule: self.all(k, k.size() <= 63 && self[k].size() <= 256)
                    blips:
                      description: |-
                        Blips are the blips the coordinator started for this task. The engine
                        maintains the list.
                      items:
                        type: string
                      maxItems: 8
                      type: array
                      x-kubernetes-list-type: set
                    id:
                      description: ID is short and DNS-safe because it labels blips.
                      maxLength: 16
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    note:
                      maxLength: 256
                      type: string
                    open:
                      type: boolean
                    title:
                      maxLength: 120
                      type: string
                    updated:
                      format: date-time
                      type: string
                  required:
                  - id
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              timers:
                description: Timers wake the coordinator at a fixed time.
                items:
                  description: ThreadTimer is a pending wake-up.
                  properties:
                    at:
                      format: date-time
                      type: string
                    id:
                      maxLength: 63
                      minLength: 1
                      type: string
                    note:
                      type: string
                  required:
                  - at
                  - id
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              tokenDay:
                description: |-
                  TokenDay is the day TokensToday refers to, in YYYY-MM-DD. It resets
                  the daily budget at midnight UTC.
                type: string
              tokensToday:
                description: TokensToday is the token spend in the current day.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
