# Images are pulled from the plain-HTTP registry container blip-registry on the
# kind docker network (localhost:5001 from the host).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blip-controller
  namespace: blip-system
spec:
  template:
    spec:
      containers:
        - name: controller
          args:
            - --leader-elect
            - --runtime-image=$(RUNTIME_IMAGE)
            - --insecure-registry=blip-registry:5000
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: blip-node
  namespace: blip-system
spec:
  template:
    spec:
      containers:
        - name: node
          args:
            - --insecure-registry=blip-registry:5000
