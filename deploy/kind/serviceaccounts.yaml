# Pool service accounts. Guests get a token for their pool's account, so this
# is what `blip` can do from inside a blip; the ownership admission policy
# further limits owned blips to their owner's resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blip-sandbox
  namespace: blip-ssh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blip-sandbox
  namespace: blip-ssh
rules:
  - apiGroups: [blip.dev]
    resources: [blips, blipstates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blip.dev]
    resources: [blippools]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blip-sandbox
  namespace: blip-ssh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blip-sandbox
subjects:
  - kind: ServiceAccount
    name: blip-sandbox
    namespace: blip-ssh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blip-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blip-agent
  namespace: default
rules:
  - apiGroups: [blip.dev]
    resources: [blips, blipstates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blip.dev]
    resources: [blippools]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blip-agent
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blip-agent
subjects:
  - kind: ServiceAccount
    name: blip-agent
    namespace: default
