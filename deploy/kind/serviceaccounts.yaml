# Pool service accounts. Guests get a token for their blip's account (which
# defaults to the pool's), so this is what `blip` can do from inside a blip.
# Give each trust boundary its own account: isolation is now RBAC on that
# account, and blips that share one share its permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blip-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blip-agent
  namespace: default
rules:
  - apiGroups: [blip.dev]
    resources: [blips, blipstates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [blip.dev]
    resources: [blippools]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # The guest CLI follows logs and drives stdin through the stream API.
  - apiGroups: [stream.blip.dev]
    resources: [blipstreams, blipstreams/log]
    verbs: [get]
  - apiGroups: [stream.blip.dev]
    resources: [blipstreams, blipstreams/stdin]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blip-agent
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blip-agent
subjects:
  - kind: ServiceAccount
    name: blip-agent
    namespace: default
---
# Chat VMs run blipchat conversations. Their token is only for discovery: the
# guest may read its own conversation and the pods around it, but blipchat
# performs every create, update, and delete with its own service account. The
# blip-chat-session admission policy denies chat-object writes from any other
# identity, so keep this role read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blip-chat
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blip-chat
  namespace: default
rules:
  - apiGroups: [blip.dev]
    resources: [blips, blipstates]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blip-chat
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blip-chat
subjects:
  - kind: ServiceAccount
    name: blip-chat
    namespace: default
