apiVersion: blip.dev/v1alpha1
kind: BlipPool
metadata:
  name: default
  namespace: default
spec:
  serviceAccountName: blip-agent
  # Fixed HTTPS endpoints are exposed to workloads at http://<name>/. The
  # sidecar adds the projected token and CA, so the guest never holds them.
  # endpoints:
  #   - name: whoami
  #     url: https://whoami.example.com
  #     audience: blip-gateway
  # Direct egress is denied unless explicitly allowed. The tokenless
  # Kubernetes API endpoint is separate from these rules. Explicit CIDRs,
  # including 0.0.0.0/0, do not inherit the default policy's exclusions, so
  # keep this except list in sync with privateCIDRs in internal/network.
  network:
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            serviceSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      # Node-local DNS proxies (AKS LocalDNS and NodeLocal DNSCache) use
      # link-local addresses that the 169.254.0.0/16 exception below denies,
      # so allow the exact resolvers a pod's resolv.conf may name.
      - to:
          - ipBlock:
              cidr: 169.254.10.10/32
          - ipBlock:
              cidr: 169.254.10.11/32
          - ipBlock:
              cidr: 169.254.20.10/32
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 0.0.0.0/8
                - 10.0.0.0/8
                - 100.64.0.0/10
                - 127.0.0.0/8
                - 168.63.129.16/32
                - 169.254.0.0/16
                - 172.16.0.0/12
                - 192.0.0.0/24
                - 192.0.2.0/24
                - 192.88.99.0/24
                - 192.168.0.0/16
                - 198.18.0.0/15
                - 198.51.100.0/24
                - 203.0.113.0/24
                - 224.0.0.0/4
                - 240.0.0.0/4
        ports:
          - protocol: TCP
            port: 443
  cpus: 1
  memory: 1Gi
  warmCount: 2
  nodeSelector:
    blip.dev/node-pool: default
