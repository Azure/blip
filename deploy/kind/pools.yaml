apiVersion: blip.dev/v1alpha1
kind: BlipPool
metadata:
  name: default
  namespace: default
spec:
  serviceAccountName: blip-agent
  # Fixed HTTPS endpoints are exposed to workloads at http://<name>/. The
  # sidecar adds the projected token and CA, so the guest never holds them.
  # endpoints:
  #   - name: whoami
  #     url: https://whoami.example.com
  #     audience: blip-controller
  # Direct egress is denied unless explicitly allowed; omitting this field
  # denies everything. The tokenless Kubernetes API endpoint is separate from
  # these rules. Port 53 to the configured resolvers (spec.dns, default
  # 1.1.1.1 and 1.0.0.1) is added automatically to every layer that allows
  # egress. Metadata, loopback, and link-local destinations stay blocked
  # whatever the rules say.
  network:
    egress:
      # 0.0.0.0/0 does not inherit any private-range exclusions. Keep this
      # except list in sync with blockedCIDRs in internal/network/compile.go
      # plus the cluster's private ranges.
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 0.0.0.0/8
                - 10.0.0.0/8
                - 100.64.0.0/10
                - 127.0.0.0/8
                - 168.63.129.16/32
                - 169.254.0.0/16
                - 172.16.0.0/12
                - 192.0.0.0/24
                - 192.0.2.0/24
                - 192.88.99.0/24
                - 192.168.0.0/16
                - 198.18.0.0/15
                - 198.51.100.0/24
                - 203.0.113.0/24
                - 224.0.0.0/4
                - 240.0.0.0/4
        ports:
          - protocol: TCP
            port: 443
  cpus: 1
  memory: 1Gi
  warmCount: 2
  nodeSelector:
    blip.dev/node-pool: default
---
# Chat VMs run blipchat conversations. The read-only blip-chat service account
# lets a guest discover its session; blipchat writes chat objects. The
# blipchat-mcp endpoint is the only way a guest starts a child chat, and the
# blip-chat-policy ConfigMap (deploy/base/chat-agent-policy.yaml) decides which
# profiles and depths are allowed.
apiVersion: blip.dev/v1alpha1
kind: BlipPool
metadata:
  name: blip-chat
  namespace: default
spec:
  serviceAccountName: blip-chat
  endpoints:
    - name: blipchat-mcp
      url: https://blipchat-mcp.blip-system.svc
      audience: blipchat
      caConfigMap: blipchat-mcp-ca
  # Resource defaults match the default pool above.
  network:
    egress:
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 0.0.0.0/8
                - 10.0.0.0/8
                - 100.64.0.0/10
                - 127.0.0.0/8
                - 168.63.129.16/32
                - 169.254.0.0/16
                - 172.16.0.0/12
                - 192.0.0.0/24
                - 192.0.2.0/24
                - 192.88.99.0/24
                - 192.168.0.0/16
                - 198.18.0.0/15
                - 198.51.100.0/24
                - 203.0.113.0/24
                - 224.0.0.0/4
                - 240.0.0.0/4
        ports:
          - protocol: TCP
            port: 443
  cpus: 1
  memory: 1Gi
  warmCount: 2
  nodeSelector:
    blip.dev/node-pool: default
