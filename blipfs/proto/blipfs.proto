syntax = "proto3";

package blipfs;

option go_package = "github.com/blipfs/blipfs/proto;pb";

// Sequencer is served by the elected leader on --listen.
service Sequencer {
  rpc Token(TokenReq) returns (TokenResp);
  rpc Tail(TailReq) returns (TailResp);
  rpc Ack(AckReq) returns (AckResp);
}

// Control is served by every daemon on its unix socket for the CLI.
service Control {
  rpc Run(CmdReq) returns (CmdResp);
}

message TokenReq {
  repeated string streams = 1;
  uint32 n = 2;
  repeated uint64 acked = 3;
}

message TokenResp {
  uint64 epoch = 1;
  uint64 lsn = 2;
  repeated uint64 backptrs = 3;
}

message TailReq {
  repeated string streams = 1;
}

message TailResp {
  uint64 epoch = 1;
  uint64 next = 2;
  repeated uint64 tails = 3;
}

message AckReq {
  repeated uint64 lsns = 1;
}

message AckResp {}

message CmdReq {
  repeated string args = 1;
  string cwd = 2;
}

message CmdResp {
  string output = 1;
  int32 code = 2;
}
