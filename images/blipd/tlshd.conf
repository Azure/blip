# tlshd for NVMe/TCP TLS. Keys come from the kernel .nvme keyring.
# ktls-utils 0.9 (Ubuntu 24.04) reads keyrings from [main]; newer
# versions read it from [authenticate].
[main]
debug=0
tlsdebug=0
nl_debug=0
keyrings=.nvme

[authenticate]
keyrings=.nvme

[authenticate.client]

[authenticate.server]
