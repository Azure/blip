---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: blipvols.blip.example.com
spec:
  group: blip.example.com
  names:
    kind: BlipVol
    listKind: BlipVolList
    plural: blipvols
    singular: blipvol
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.current
      name: Current
      type: integer
    - jsonPath: .status.size
      name: Size
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BlipVol is a volume with a bounded history of snapshots. Attaching it to
          a Blip starts from the newest Ready snapshot.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BlipVolSpec describes the initial content and the snapshot policy. A
              BlipVol with an image is an ext4 filesystem built from the image. A BlipVol
              with a parent is a clone of a parent snapshot. A BlipVol with neither is a
              zero-filled raw block device of spec.size (default 20Gi) with no
              filesystem. image, parent and size are immutable; snapshotPolicy is
              mutable.
            properties:
              image:
                description: ImageSource is an OCI image to import.
                properties:
                  pullSecretRef:
                    description: PullSecretRef names a docker config Secret in the
                      same namespace.
                    properties:
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  reference:
                    minLength: 1
                    type: string
                required:
                - reference
                type: object
              parent:
                description: |-
                  ParentRef names the BlipVol to derive from and, optionally, which of its
                  snapshots.
                properties:
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace defaults to the namespace of the new BlipVol.
                    type: string
                  snapshot:
                    description: |-
                      Snapshot is the sequence of the parent snapshot to clone. Unset means
                      the parent's newest Ready snapshot, or, while the parent is attached
                      to a running Blip, the first snapshot captured after this BlipVol was
                      created (a live capture is triggered).
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - name
                type: object
              size:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Size of a new empty volume. Defaults to 20Gi in the controller when
                  neither image nor parent is set.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              snapshotPolicy:
                description: |-
                  SnapshotPolicy says when snapshots of the volume are taken while it is
                  attached to a Blip, and how many are kept.
                properties:
                  interval:
                    description: |-
                      Interval takes a snapshot every interval while the volume is attached,
                      e.g. "30m" or "1h". At least 5m. Unset means no interval snapshots.
                    maxLength: 32
                    type: string
                    x-kubernetes-validations:
                    - message: interval must be at least 5m
                      rule: duration(self) >= duration('5m')
                  limit:
                    default: 24
                    description: |-
                      Limit is the number of Ready snapshots kept. Older ones are deleted
                      unless pinned or held.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  skipShutdown:
                    description: |-
                      SkipShutdown disables the snapshot taken when the volume is released
                      (VM stop, live detach, end of the run). Writes after the newest
                      snapshot are then discarded. Snapshots for a reschedule are taken
                      regardless.
                    type: boolean
                type: object
            type: object
            x-kubernetes-validations:
            - message: set at most one of image and parent
              rule: '!(has(self.image) && has(self.parent))'
            - message: size is not allowed with parent
              rule: '!(has(self.parent) && has(self.size))'
            - message: image is immutable
              rule: has(self.image) == has(oldSelf.image) && (!has(self.image) ||
                self.image == oldSelf.image)
            - message: parent is immutable
              rule: has(self.parent) == has(oldSelf.parent) && (!has(self.parent)
                || self.parent == oldSelf.parent)
            - message: size is immutable
              rule: has(self.size) == has(oldSelf.size) && (!has(self.size) || self.size
                == oldSelf.size)
          status:
            description: BlipVolStatus is written only by the controller.
            properties:
              claim:
                description: Claim is the exclusive attachment, if any.
                properties:
                  allocationID:
                    type: string
                  attachmentID:
                    type: string
                  baseline:
                    description: |-
                      Baseline is the newest Ready snapshot taken by this attachment: the
                      base of its next incremental save. 0 until the first one.
                    format: int64
                    type: integer
                  blipName:
                    type: string
                  blipUID:
                    type: string
                  generation:
                    description: |-
                      Generation is the claim generation; equals status.claimGeneration
                      at the time the claim was taken.
                    format: int64
                    type: integer
                  node:
                    type: string
                  since:
                    format: date-time
                    type: string
                  snapshot:
                    description: Snapshot is the sequence the attachment started from.
                    format: int64
                    type: integer
                required:
                - attachmentID
                - blipName
                - blipUID
                - generation
                type: object
              claimGeneration:
                description: |-
                  ClaimGeneration is the last claim generation handed out. It never
                  decreases and survives claim release.
                format: int64
                type: integer
              conditions:
                description: 'Conditions: Ready, Failed, RetentionLimitExceeded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              current:
                description: |-
                  Current is the sequence of the newest Ready snapshot, which every
                  attach starts from. 0 means none yet.
                format: int64
                type: integer
              holds:
                description: |-
                  Holds block deletion; the data is deleted only when claim and holds
                  are empty.
                items:
                  description: |-
                    Hold blocks deletion of a BlipVol and, with snapshot set, compaction of
                    that snapshot.
                  properties:
                    holder:
                      description: HolderRef names the object holding a BlipVol.
                      properties:
                        kind:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        uid:
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    kind:
                      description: HoldKind says why data must be kept.
                      enum:
                      - Attachment
                      - Clone
                      type: string
                    message:
                      type: string
                    since:
                      format: date-time
                      type: string
                    snapshot:
                      description: Snapshot is the sequence held (the clone source
                        of a Clone hold).
                      format: int64
                      type: integer
                  required:
                  - holder
                  - kind
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              imageDigest:
                type: string
              lastSequence:
                description: LastSequence is the highest sequence ever allocated.
                format: int64
                type: integer
              origin:
                description: Origin is the parent snapshot this BlipVol was derived
                  from.
                properties:
                  contentID:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  snapshot:
                    description: Snapshot is the parent sequence; 0 while waiting
                      for a live capture.
                    format: int64
                    type: integer
                  uid:
                    type: string
                required:
                - name
                - namespace
                - uid
                type: object
              phase:
                description: Phase is Ready once sequence 1 is Ready.
                type: string
              rootContentID:
                description: |-
                  RootContentID is the content ID at the root of the lineage (shared by
                  derived BlipVols).
                type: string
              size:
                anyOf:
                - type: integer
                - type: string
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              snapshots:
                description: Snapshots is the snapshot history, oldest first.
                items:
                  description: VolSnapshot is one entry of the snapshot history of
                    a BlipVol.
                  properties:
                    base:
                      description: |-
                        Base is the content ID this snapshot was sent incrementally against;
                        empty for a full copy.
                      type: string
                    captureTime:
                      format: date-time
                      type: string
                    contentID:
                      description: |-
                        ContentID identifies the data on the storage nodes:
                        <BlipVol UID>-<sequence>.
                      type: string
                    message:
                      type: string
                    reason:
                      description: SnapshotReason says why a snapshot was taken.
                      enum:
                      - Initial
                      - Shutdown
                      - Interval
                      - Derive
                      - Reschedule
                      type: string
                    replicas:
                      items:
                        description: Replica is one copy of the content.
                        properties:
                          node:
                            type: string
                          state:
                            description: ReplicaState is the state of one replica.
                            type: string
                        required:
                        - node
                        - state
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - node
                      x-kubernetes-list-type: map
                    result:
                      description: Result is the result of the run, for snapshots
                        taken at its end.
                      properties:
                        exitCode:
                          format: int32
                          type: integer
                        restartCount:
                          format: int32
                          type: integer
                      required:
                      - exitCode
                      - restartCount
                      type: object
                    sequence:
                      description: |-
                        Sequence numbers snapshots of this BlipVol, starting at 1. Never
                        reused.
                      format: int64
                      minimum: 1
                      type: integer
                    state:
                      description: SnapshotState is the state of a snapshot.
                      enum:
                      - Pending
                      - Ready
                      - Failed
                      type: string
                    storageGroup:
                      type: string
                    writer:
                      description: Writer is the attachment that wrote the data; unset
                        for Initial.
                      properties:
                        attachmentID:
                          type: string
                        blipName:
                          type: string
                        blipUID:
                          type: string
                        generation:
                          description: |-
                            Generation is the claim generation the attachment held when it
                            wrote the snapshot.
                          format: int64
                          type: integer
                      required:
                      - attachmentID
                      - blipName
                      - blipUID
                      type: object
                  required:
                  - contentID
                  - reason
                  - sequence
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - sequence
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
