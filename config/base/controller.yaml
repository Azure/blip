apiVersion: apps/v1
kind: Deployment
metadata:
  name: blip-controller
  namespace: blip-system
  labels: {app.kubernetes.io/name: blip-controller}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: blip-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: blip-controller}
    spec:
      serviceAccountName: blip-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller
        image: blipd
        # Flags and defaults: docs/controller.md (Flags).
        args: [controller, --slot-image=blip-slot]
        # Port 8443 serves node gRPC over TLS.
        ports:
        - {name: https, containerPort: 8443}
        - {name: metrics, containerPort: 9090}
        - {name: probes, containerPort: 8081}
        readinessProbe:
          httpGet: {path: /readyz, port: probes}
        livenessProbe:
          httpGet: {path: /healthz, port: probes}
          initialDelaySeconds: 15
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: blip-controller
  namespace: blip-system
spec:
  selector: {app.kubernetes.io/name: blip-controller}
  ports:
  - {name: https, port: 8443, targetPort: https}
  - {name: metrics, port: 9090, targetPort: metrics}
