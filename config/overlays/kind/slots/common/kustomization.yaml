# Kind slots for one tenant namespace, without a namespace: the
# per-namespace kustomizations next to it set it, and hack/e2e/run.sh applies
# this with `kubectl -n <ns>` after recreating its namespaces.
resources: []
components:
- ../../../../components/slots
patches:
# Small SKU for kind: 1 vCPU, 512Mi guest memory. Kind has 6 hypervisor
# devices in total, shared by all namespaces: the namespaces patch minFree
# and maxFree, and maxSlots caps free + booting + assigned.
- target: {kind: BlipPool, name: default}
  patch: |
    - {op: replace, path: /spec/cpus, value: 1}
    - {op: replace, path: /spec/memory, value: 512Mi}
    - {op: replace, path: /spec/minFree, value: 2}
    - {op: replace, path: /spec/maxFree, value: 3}
    - {op: add, path: /spec/maxSlots, value: 4}
# The kind API server: the kubernetes Service (10.96.0.1:443) is DNATed to
# the control-plane node on the kind docker network (172.18.0.0/16, port
# 6443), and policies match after DNAT. Both are allowed.
- target: {kind: NetworkPolicy, name: blip-slots}
  patch: |
    - op: add
      path: /spec/egress/-
      value:
        to:
        - ipBlock: {cidr: 172.18.0.0/16}
        ports:
        - {protocol: TCP, port: 6443}
    - op: add
      path: /spec/egress/-
      value:
        to:
        - ipBlock: {cidr: 10.96.0.1/32}
        ports:
        - {protocol: TCP, port: 443}
